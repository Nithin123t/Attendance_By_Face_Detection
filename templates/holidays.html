<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Attendance System - Holiday Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }
        .content-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            border: none;
        }
        .card-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
        }
        .card-body {
            padding: 2rem;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }
        .btn-add {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.3);
        }
        .btn-delete {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            border: none;
            border-radius: 8px;
            padding: 0.4rem 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .btn-delete:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(220, 38, 38, 0.3);
        }
        .table {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            overflow: hidden;
        }
        .table thead th {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            font-weight: 600;
        }
        .table tbody tr:hover {
            background: rgba(30, 60, 114, 0.1);
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            .card-header h1 {
                font-size: 1.8rem;
            }
            .card-body {
                padding: 1rem;
            }
            .row.g-3.mb-4 {
                margin-bottom: 2rem;
            }
            .col-md-4, .col-md-6, .col-md-2 {
                margin-bottom: 1rem;
            }
            .table-responsive {
                font-size: 0.85rem;
            }
            .btn-delete {
                padding: 0.3rem 0.5rem;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 576px) {
            .card-header {
                padding: 1.5rem 0.5rem;
            }
            .card-header h1 {
                font-size: 1.5rem;
            }
            .card-body {
                padding: 0.75rem;
            }
            .form-control {
                font-size: 0.9rem;
                padding: 0.6rem 0.8rem;
            }
            .btn-add {
                font-size: 0.9rem;
                padding: 0.6rem 1rem;
            }
            .table-responsive {
                font-size: 0.8rem;
            }
            .btn-delete {
                padding: 0.25rem 0.4rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand text-white fw-bold fs-4">
                <i class="fas fa-camera me-2"></i>Face Attendance System
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="content-card">
            <div class="card-header">
                <h1><i class="fas fa-calendar-times me-3"></i>Holiday Schedule</h1>
                <p>Manage holiday dates and reasons</p>
            </div>
            <div class="card-body">
                <form method="POST" class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Holiday Date</label>
                        <input type="date" name="holiday_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Reason</label>
                        <input type="text" name="reason" class="form-control" placeholder="Enter holiday reason">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-add w-100">
                            <i class="fas fa-plus me-1"></i>Add
                        </button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Reason</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for h in holidays %}
                            <tr>
                                <td>{{ h.holiday_date }}</td>
                                <td>{{ h.reason }}</td>
                                <td>
                                    <a href="{{ url_for('delete_holiday', holiday_id=h.holiday_id) }}"
                                       class="btn btn-delete">Delete</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
