<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Attendance System - Take Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }
        .attendance-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
        }
        .card-header {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 2rem 1rem;
            margin: -3rem -3rem 2rem -3rem;
            border: none;
        }
        .card-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
        }
        .scan-icon {
            font-size: 5rem;
            color: #059669;
            margin-bottom: 1rem;
        }
        .btn-scan {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            border: none;
            border-radius: 15px;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        .btn-scan:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(5, 150, 105, 0.4);
        }
        .btn-back {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(107, 114, 128, 0.3);
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            body {
                padding: 0;
                margin: 0;
                display: block; /* Change from flex to block for top-to-bottom layout */
                align-items: flex-start; /* Align to top instead of center */
                padding-top: 76px; /* Account for fixed navbar height */
            }
            .navbar {
                position: fixed;
                top: 0;
                width: 100%;
                z-index: 1000;
            }
            .container {
                padding: 0;
                margin: 0;
                max-width: 100%;
            }
            .row {
                margin: 0;
            }
            .col-md-6 {
                padding: 0;
                flex: none;
                max-width: 100%;
            }
            .attendance-card {
                border-radius: 0;
                margin: 0;
                min-height: calc(100vh - 76px); /* Adjust for navbar height */
                padding: 2rem 1rem;
                max-width: none;
                width: 100%;
            }
            .card-header {
                padding: 2rem 1rem;
                margin: -2rem -1rem 2rem -1rem;
                border-radius: 0;
            }
            .card-header h1 {
                font-size: 2rem;
            }
            .scan-icon {
                font-size: 4.5rem;
                margin-bottom: 1.5rem;
            }
            .btn-scan {
                padding: 1rem 2.5rem;
                font-size: 1.1rem;
                width: 100%;
                max-width: none;
                margin-bottom: 1rem;
            }
            .btn-back {
                padding: 0.8rem 2rem;
                font-size: 1rem;
                width: 100%;
                max-width: none;
            }
            .navbar-brand {
                font-size: 1.1rem;
            }
            h4 {
                font-size: 1.4rem;
                margin-bottom: 1rem;
            }
            p {
                font-size: 1rem;
                margin-bottom: 1.5rem;
            }
        }

        @media (max-width: 576px) {
            .attendance-card {
                padding: 1.5rem 0.8rem;
            }
            .card-header {
                padding: 1.5rem 0.8rem;
                margin: -1.5rem -0.8rem 1.5rem -0.8rem;
            }
            .card-header h1 {
                font-size: 1.8rem;
            }
            .scan-icon {
                font-size: 4rem;
                margin-bottom: 1.2rem;
            }
            h4 {
                font-size: 1.2rem;
                margin-bottom: 0.8rem;
            }
            p {
                font-size: 0.95rem;
                margin-bottom: 1.2rem;
            }
            .btn-scan {
                padding: 0.9rem 2rem;
                font-size: 1rem;
            }
            .btn-back {
                padding: 0.7rem 1.5rem;
                font-size: 0.9rem;
            }
            .navbar-brand {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand text-white fw-bold fs-4">
                <i class="fas fa-camera me-2"></i>Face Attendance System
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="attendance-card">
                    <div class="card-header">
                        <h1><i class="fas fa-camera me-3"></i>Take Attendance</h1>
                        <p class="mb-0 mt-2 opacity-75">Face Recognition Attendance</p>
                    </div>

                    <div class="scan-icon">
                        <i class="fas fa-camera-retro"></i>
                    </div>

                    <h4 class="mb-4">Ready to Scan Faces</h4>
                    <p class="text-muted mb-4">Click the button below to start the face recognition attendance system</p>

                    <a href="{{ url_for('start_attendance') }}" class="btn-scan">
                        <i class="fas fa-play me-2"></i>Start Face Scan
                    </a>

                    <br>

                    <a href="{{ url_for('dashboard') }}" class="btn-back">
                        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
