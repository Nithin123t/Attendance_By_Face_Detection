<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Leave</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .dashboard-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .btn-submit {
            background: #0d6efd;
            color: white;
            font-weight: 600;
            border: none;
        }
        .btn-submit:hover {
            background: #0b5ed7;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand text-white fw-bold fs-4">
            <i class="fas fa-calendar-plus me-2"></i>Request Leave
        </span>
        <a href="{{ url_for('student_dashboard') }}" class="btn btn-light">
            <i class="fas fa-arrow-left me-1"></i>Back
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="dashboard-card">

        <h3 class="mb-4 text-center">
            <i class="fas fa-user-graduate me-2"></i>Student Leave Application
        </h3>

        <form method="POST" action="{{ url_for('request_leave') }}">

            <!-- STUDENT DETAILS (READ-ONLY) -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" value="{{ student.name }}" disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Roll Number</label>
                    <input type="text" class="form-control" value="{{ student.roll_no }}" disabled>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-control" value="{{ student.email }}" disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" value="{{ student.phone }}" disabled>
                </div>
            </div>

            <!-- LEAVE DATES -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" required>
                </div>
            </div>

            <!-- DESCRIPTION -->
            <div class="mb-4">
                <label class="form-label">Reason / Description</label>
                <textarea name="description" class="form-control" rows="4" required
                          placeholder="Explain the reason for leave..."></textarea>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">
                    Cancel
                </a>
                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-paper-plane me-1"></i>Submit Request
                </button>
            </div>

        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Basic client-side validation
    document.querySelector("form").addEventListener("submit", function(e) {
        const start = document.querySelector("[name='start_date']").value;
        const end = document.querySelector("[name='end_date']").value;

        if (end < start) {
            alert("End date cannot be before start date");
            e.preventDefault();
        }
    });
</script>

</body>
</html>
