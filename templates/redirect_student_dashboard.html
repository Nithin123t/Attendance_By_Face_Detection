<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Attendance System - Redirecting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }
        .redirect-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
        }
        .card-header {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 2rem 1rem;
            margin: -3rem -3rem 2rem -3rem;
            border: none;
        }
        .card-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
        }
        .redirect-icon {
            font-size: 4rem;
            color: #059669;
            margin-bottom: 1rem;
        }
        .spinner {
            width: 3rem;
            height: 3rem;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #059669;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand text-white fw-bold fs-4">
                <i class="fas fa-camera me-2"></i>Face Attendance System
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="redirect-card">
                    <div class="card-header">
                        <h1><i class="fas fa-user-graduate me-3"></i>Redirecting</h1>
                        <p class="mb-0 mt-2 opacity-75">Taking you to your dashboard</p>
                    </div>

                    <div class="redirect-icon">
                        <i class="fas fa-arrow-right"></i>
                    </div>

                    <h4 class="mb-3">Loading Student Dashboard...</h4>
                    <p class="text-muted mb-4">Please wait while we redirect you</p>

                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Replace current history entry with student dashboard
        setTimeout(() => {
            window.location.replace('/student-dashboard');
        }, 1500); // 1.5 second delay for visual feedback
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
