<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Attendance System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            border: none;
        }
        .card-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
        }
        .card-body {
            padding: 3rem;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .btn-login {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        .btn-student {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-student:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
        }
        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }
        .divider span {
            background: white;
            padding: 0 1rem;
            color: #6b7280;
            font-weight: 500;
        }
        .links {
            text-align: center;
            margin-top: 1.5rem;
        }
        .links a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            margin: 0 1rem;
            transition: color 0.3s ease;
        }
        .links a:hover {
            color: #7c3aed;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="login-card">
            <div class="card-header">
                <h1><i class="fas fa-camera me-3"></i>Face Attendance</h1>
                <p class="mb-0 mt-2 opacity-75">Secure Login Portal</p>
            </div>
            <div class="card-body">
                <div class="row g-4">
                    <!-- Admin Login -->
                    <div class="col-md-6">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-shield fa-3x text-primary mb-3"></i>
                            <h4 class="text-primary">Admin Login</h4>
                        </div>

                        <!-- Error Alert -->
                        {% if error %}
                        <div class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            {{ error }}
                        </div>
                        {% endif %}

                        <form method="POST" action="/login">
                            <input type="hidden" name="user_type" value="admin">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Enter admin username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-login">
                                <i class="fas fa-sign-in-alt me-2"></i>Login as Admin
                            </button>
                        </form>

                        <div class="links">
                            <a href="#">Create Admin Account</a>
                        </div>
                    </div>

                    <!-- Student Login -->
                    <div class="col-md-6">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-graduate fa-3x text-success mb-3"></i>
                            <h4 class="text-success">Student Login</h4>
                        </div>

                        <!-- Error Alert -->
                        {% if student_error %}
                        <div class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            {{ student_error }}
                        </div>
                        {% endif %}

                        <form method="POST" action="/login">
                            <input type="hidden" name="user_type" value="student">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username / Roll No</label>
                                <input type="text" name="username" class="form-control" placeholder="Enter username or roll number" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-student">
                                <i class="fas fa-sign-in-alt me-2"></i>Login as Student
                            </button>
                        </form>

                        <div class="links">
                            <small class="text-muted">Contact admin if you forgot your credentials</small>
                        </div>
                    </div>
                </div>

                <div class="divider">
                    <span>Quick Links</span>
                </div>

                <div class="text-center">
                    <a href="#" class="btn btn-outline-primary me-2">
                        <i class="fas fa-key me-1"></i>Forgot Password?
                    </a>
                    <a href="#" class="btn btn-outline-secondary">
                        <i class="fas fa-question-circle me-1"></i>Help
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        // Handle signup and forgot password links
        document.addEventListener('DOMContentLoaded', function() {
            // Signup link
            const signupLink = document.querySelector('a[href="#"]');
            if (signupLink) {
                signupLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = '/signup';
                });
            }

            // Forgot password link
            const forgotLink = document.querySelectorAll('a[href="#"]')[1];
            if (forgotLink && forgotLink.textContent.includes('Forgot')) {
                forgotLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = '/forgot-password';
                });
            }
        });
    </script>
</body>
</html>
